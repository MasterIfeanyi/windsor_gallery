[build]
  # Install both projects, build the server file, then build the frontend
  command = "npm --prefix backend ci --include=dev && npm --prefix frontend ci --include=dev && npm --prefix backend run build:function && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "backend/netlify/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Netlify ships the single built file plus the packages it needs
  node_bundler = "nft"